plugins {
    id 'com.android.application'
}

android {
    namespace 'de.andre.heimspiel'
    compileSdk 36

    defaultConfig {
        applicationId providers.gradleProperty('heimspielApplicationId').getOrElse('de.andre.heimspiel')
        minSdk 26
        targetSdk 35
        versionCode providers.gradleProperty('heimspielVersionCode').getOrElse('5').toInteger()
        versionName providers.gradleProperty('heimspielVersionName').getOrElse('0.5.0')
        testInstrumentationRunner 'de.andre.heimspiel.UpdateInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
    androidResources {
        noCompress += ['m4a', 'webp']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
